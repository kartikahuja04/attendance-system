<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Marked - Success</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .success-box {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
            max-width: 400px;
        }
        
        .success-icon {
            font-size: 64px;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        
        .success-box h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .success-box p {
            color: #666;
            margin-bottom: 10px;
        }
        
        .success-box .info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }
        
        .success-box .info strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="success-box">
        <div class="success-icon">✓</div>
        <h2>Attendance Marked Successfully!</h2>
        <div class="info">
            <p><strong>Student ID:</strong> {{ student_id }}</p>
            <p><strong>Session:</strong> {{ session_id }}</p>
            <p><strong>Time:</strong> {{ timestamp }}</p>
        </div>
        <p style="color: #4CAF50; font-weight: 600;">Thank you for marking your attendance!</p>
    </div>
</body>
</html>
