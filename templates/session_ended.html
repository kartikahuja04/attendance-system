<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Ended - Attendance System</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, var(--danger-dark) 0%, var(--danger) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .message-box {
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
            max-width: 400px;
        }
        
        .message-icon {
            font-size: 64px;
            color: var(--danger);
            margin-bottom: 20px;
        }
        
        .message-box h2 {
            color: var(--text);
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .message-box p {
            color: var(--muted);
            margin-bottom: 10px;
        }
        
        .home-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--primary-dark);
            background: var(--primary-dark);
        }
    </style>
</head>
<body>
    <div class="message-box">
        <div class="message-icon">🔒</div>
        <h2>Session Ended</h2>
        <p>This session has been ended. No more attendance can be marked for this session.</p>
        <p><strong>Session ID:</strong> {{ session_id }}</p>
        <a href="/dashboard" class="home-btn">Go to Dashboard</a>
    </div>
</body>
</html>
