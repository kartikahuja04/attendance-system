<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Attendance System</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, var(--danger-dark) 0%, var(--danger) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .error-box {
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
            max-width: 400px;
        }
        
        .error-icon {
            font-size: 64px;
            color: var(--danger);
            margin-bottom: 20px;
        }
        
        .error-box h2 {
            color: var(--text);
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .error-box p {
            color: var(--muted);
            margin-bottom: 20px;
        }
        
        .home-btn {
            display: inline-block;
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--primary-dark);
            background: var(--primary-dark);
        }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-icon">⚠️</div>
        <h2>Error</h2>
        <p>{{ error }}</p>
        <a href="/" class="home-btn">Back to Home</a>
    </div>
</body>
</html>
